<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="pageTitle">Biblioteca de Exercícios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>

    <main class="app-shell">
        <section class="library-hero" aria-labelledby="library-title">
            <div>
                <p class="controls-kicker mb-1" data-i18n="controlsKicker">Biblioteca</p>
                <h1 id="library-title" data-i18n="controlsTitle" class="mb-0">Exercicios</h1>
            </div>
            <p id="filter-status" class="filter-status fw-semibold mb-0" aria-live="polite"></p>
        </section>

        <section id="filter-panel" class="controls-panel" aria-label="Exercise filters" hidden>
            <div id="filter-options" class="filter-options" hidden>
                <div class="filter-grid row g-3" aria-label="Opcoes de filtro">
                    <div class="filter-col col-12 col-md-6 col-lg-4">
                        <label class="filter-field">
                            <span data-i18n="muscleLabel">Musculo</span>
                            <select id="filter-primaryMuscles" class="filter-select form-select" data-filter="primaryMuscles">
                                <option value="" data-i18n="allMuscles">Todos os musculos</option>
                            </select>
                        </label>
                    </div>

                    <div class="filter-col col-12 col-md-6 col-lg-4">
                        <label class="filter-field">
                            <span data-i18n="difficultyLabel">Dificuldade</span>
                            <select id="filter-level" class="filter-select form-select" data-filter="level">
                                <option value="" data-i18n="allDifficulties">Todas as dificuldades</option>
                            </select>
                        </label>
                    </div>

                    <div class="filter-col col-12 col-md-6 col-lg-4">
                        <label class="filter-field">
                            <span data-i18n="equipmentLabel">Equipamento</span>
                            <select id="filter-equipment" class="filter-select form-select" data-filter="equipment">
                                <option value="" data-i18n="allEquipment">Todos os equipamentos</option>
                            </select>
                        </label>
                    </div>

                    <div class="filter-col col-12 col-md-6 col-lg-4">
                        <label class="filter-field">
                            <span data-i18n="categoryLabel">Categoria</span>
                            <select id="filter-category" class="filter-select form-select" data-filter="category">
                                <option value="" data-i18n="allCategories">Todas as categorias</option>
                            </select>
                        </label>
                    </div>

                    <div class="filter-col col-12 col-md-6 col-lg-4">
                        <label class="filter-field">
                            <span data-i18n="forceLabel">Forca</span>
                            <select id="filter-force" class="filter-select form-select" data-filter="force">
                                <option value="" data-i18n="allForces">Todas as forcas</option>
                            </select>
                        </label>
                    </div>

                    <div class="filter-col col-12 col-md-6 col-lg-4">
                        <label class="filter-field">
                            <span data-i18n="secondaryMuscleLabel">Musculo secundario</span>
                            <select id="filter-secondaryMuscles" class="filter-select form-select" data-filter="secondaryMuscles">
                                <option value="" data-i18n="allSecondaryMuscles">Todos os secundarios</option>
                            </select>
                        </label>
                    </div>
                </div>

                <div class="filter-actions">
                    <button id="clear-filters" class="btn btn-outline-secondary d-inline-flex align-items-center gap-2" type="button">
                        <i class="fas fa-rotate-left" aria-hidden="true"></i>
                        <span data-i18n="clearFilters">Limpar filtros</span>
                    </button>
                </div>
            </div>
        </section>

        <div id="exercises-container"><!-- Aqui os exercicios serao carregados via JavaScript --></div>
        <div id="loading-indicator" style="display: none;">Carregando mais exercicios...</div>
    </main>

    <div id="backToTop" class="back-to-top">
      <i class="fas fa-arrow-up"></i>
    </div>

    <script src="/js/components/navbar.js"></script>
    <script src="/js/components/custom-select.js"></script>
    <script src="/js/script.js"></script>
    <script src="/js/components/search.js"></script>
    <script src="/js/components/dark-light.js"></script>
    <script src="/js/components/back-to-top.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
